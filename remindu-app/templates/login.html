<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - REMINDU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="login-box bg-white p-5 rounded-4 shadow-sm text-center" style="max-width: 400px; width: 100%;">
        <h2 class="fw-bold mb-2">REMINDU.</h2>
        <p class="text-muted mb-4">Masuk atau Daftar Akun Baru</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <input type="text" name="username" class="form-control mb-3 text-center" placeholder="Username" required>
            <input type="password" name="password" class="form-control mb-4 text-center" placeholder="Password" required>
            <div class="d-flex gap-2">
                <button type="submit" name="action" value="login" class="btn btn-primary w-100 fw-bold">Masuk</button>
                <button type="submit" name="action" value="register" class="btn btn-outline-primary w-100 fw-bold">Daftar</button>
            </div>
        </form>
    </div>
</body>
</html>
